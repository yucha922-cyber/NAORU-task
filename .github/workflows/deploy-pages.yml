# main への push でビルドし GitHub Pages に公開（公開リポジトリでは Actions・Pages とも無料）
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # https://<owner>.github.io/<repo>/ 配下で動かすためのパス
          BASE_PATH: /${{ github.event.repository.name }}/
          # Supabase の接続先（公開用の値。データ保護は RLS が担う）。
          # Actions Variables に同名の値を登録すると、そちらが優先される
          # ⚠ service_role / Secret key は絶対にここへ書かないこと
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://jofozpnppvrtwkkcdozb.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_SLEkEJbF4Q8nVa-ZA8Qsqg_Iw5xnxF6' }}
          # Google OAuth クライアントID（公開前提の値。クライアントシークレットは使わない）
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || '222439231144-o9966d0rdsmc503meqieha9uc6dfr06e.apps.googleusercontent.com' }}
      # SPA のため、直接アクセスされた URL（/naoru-task/tasks 等）も index.html で処理
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
